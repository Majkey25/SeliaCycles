# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "16 9 * * 1,4"
      timezone: Etc/UTC
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 19 * * 0,3"
      timezone: Etc/UTC
